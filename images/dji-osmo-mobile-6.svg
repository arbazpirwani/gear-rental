<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 360" role="img" aria-label="DJI OSMO MOBILE 6">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="body" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#3a4358"/>
      <stop offset="100%" stop-color="#1f2737"/>
    </linearGradient>
  </defs>
  <rect width="480" height="360" fill="url(#bg)"/>
  <text x="40" y="46" font-family="-apple-system,system-ui,sans-serif" font-size="11" letter-spacing="2" fill="#94a3b8" font-weight="700">DJI · GIMBAL</text>
  
    <g transform="translate(150 70)">
      <!-- handle -->
      <rect x="78" y="160" width="22" height="80" rx="3" fill="url(#body)"/>
      <!-- handle grip texture -->
      <g stroke="#3a4358" stroke-width="0.8">
        <line x1="80" y1="172" x2="98" y2="172"/><line x1="80" y1="180" x2="98" y2="180"/><line x1="80" y1="188" x2="98" y2="188"/><line x1="80" y1="196" x2="98" y2="196"/><line x1="80" y1="204" x2="98" y2="204"/><line x1="80" y1="212" x2="98" y2="212"/><line x1="80" y1="220" x2="98" y2="220"/><line x1="80" y1="228" x2="98" y2="228"/>
      </g>
      <!-- joystick + screen -->
      <rect x="76" y="130" width="26" height="26" rx="2" fill="#0a0e18"/>
      <circle cx="89" cy="143" r="4" fill="#475569"/>
      <!-- arm -->
      <path d="M89 130 L89 80 L150 80 L150 30" fill="none" stroke="#1f2737" stroke-width="6" stroke-linecap="round"/>
      <!-- phone mount -->
      <rect x="115" y="-10" width="70" height="40" rx="4" fill="#1f2737"/>
      <rect x="125" y="-2" width="50" height="24" rx="2" fill="#0a0e18"/>
      <!-- labels -->
      <text x="-30" y="100" font-family="-apple-system,system-ui,sans-serif" font-size="11" font-weight="800" fill="#f59e0b" letter-spacing="2">DJI</text>
      <text x="-30" y="118" font-family="-apple-system,system-ui,sans-serif" font-size="9" fill="#94a3b8" letter-spacing="1">OSMO MOBILE 6</text>
    </g>
  <text x="240" y="328" text-anchor="middle" font-family="-apple-system,system-ui,sans-serif" font-size="13" fill="#cbd5e1" font-weight="600">DJI OSMO MOBILE 6</text>
</svg>
