<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 360" role="img" aria-label="RODE SMARTLAV+">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="body" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#3a4358"/>
      <stop offset="100%" stop-color="#1f2737"/>
    </linearGradient>
  </defs>
  <rect width="480" height="360" fill="url(#bg)"/>
  <text x="40" y="46" font-family="-apple-system,system-ui,sans-serif" font-size="11" letter-spacing="2" fill="#94a3b8" font-weight="700">RODE · LAVALIER</text>
  
    <g transform="translate(180 100)">
      <!-- lav capsule -->
      <ellipse cx="60" cy="0" rx="22" ry="28" fill="url(#body)" stroke="#3a4358" stroke-width="1.5"/>
      <circle cx="60" cy="-2" r="14" fill="#0a0e18"/>
      <g stroke="#475569" stroke-width="0.6">
        <circle cx="60" cy="-2" r="4" fill="none"/><circle cx="60" cy="-2" r="5.5" fill="none"/><circle cx="60" cy="-2" r="7" fill="none"/><circle cx="60" cy="-2" r="8.5" fill="none"/><circle cx="60" cy="-2" r="10" fill="none"/><circle cx="60" cy="-2" r="11.5" fill="none"/>
      </g>
      <!-- cable -->
      <path d="M60 28 Q56 80 30 130 Q10 170 -20 200" fill="none" stroke="#0a0e18" stroke-width="3"/>
      <path d="M60 28 Q56 80 30 130 Q10 170 -20 200" fill="none" stroke="#475569" stroke-width="1" stroke-dasharray="2 3"/>
      <!-- clip behind capsule -->
      <rect x="48" y="20" width="24" height="6" rx="1.5" fill="#1f2737"/>
      <text x="-30" y="60" font-family="-apple-system,system-ui,sans-serif" font-size="11" font-weight="800" fill="#f59e0b" letter-spacing="2">RODE</text>
      <text x="-30" y="78" font-family="-apple-system,system-ui,sans-serif" font-size="9" fill="#94a3b8" letter-spacing="1">SMARTLAV+</text>
    </g>
  <text x="240" y="328" text-anchor="middle" font-family="-apple-system,system-ui,sans-serif" font-size="13" fill="#cbd5e1" font-weight="600">RODE SMARTLAV+</text>
</svg>
