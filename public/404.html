<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Gear Rental</title>
    <script>
      // Single Page Apps for GitHub Pages — MIT License
      // Adapted from https://github.com/rafgraph/spa-github-pages
      // Captures the deep-link path, redirects back to the SPA index where
      // a tiny restore script puts the path back into history.
      // pathSegmentsToKeep = 1 because we live under /gear-rental/.
      var pathSegmentsToKeep = 1;
      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body></body>
</html>
