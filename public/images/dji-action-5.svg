<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 360" role="img" aria-label="DJI OSMO ACTION 5">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="body" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#3a4358"/>
      <stop offset="100%" stop-color="#1f2737"/>
    </linearGradient>
  </defs>
  <rect width="480" height="360" fill="url(#bg)"/>
  <text x="40" y="46" font-family="-apple-system,system-ui,sans-serif" font-size="11" letter-spacing="2" fill="#94a3b8" font-weight="700">DJI · ACTION CAM</text>
  
    <g transform="translate(160 110)">
      <!-- body -->
      <rect x="0" y="0" width="160" height="110" rx="14" fill="url(#body)" stroke="#3a4358" stroke-width="2"/>
      <!-- front lens -->
      <circle cx="40" cy="55" r="32" fill="#000" stroke="#3a4358" stroke-width="2"/>
      <circle cx="40" cy="55" r="22" fill="#0b1020"/>
      <circle cx="40" cy="55" r="14" fill="#000"/>
      <circle cx="36" cy="51" r="4" fill="#1e293b" opacity="0.6"/>
      <!-- screen -->
      <rect x="86" y="20" width="60" height="70" rx="4" fill="#0a0e18"/>
      <rect x="92" y="26" width="48" height="54" rx="2" fill="#1e293b"/>
      <!-- record dot -->
      <circle cx="100" cy="36" r="3" fill="#dc2626"/>
      <!-- shutter on top -->
      <circle cx="80" cy="-6" r="6" fill="#f59e0b"/>
      <text x="0" y="-12" font-family="-apple-system,system-ui,sans-serif" font-size="11" font-weight="800" fill="#f59e0b" letter-spacing="2">DJI</text>
      <text x="160" y="-12" text-anchor="end" font-family="-apple-system,system-ui,sans-serif" font-size="9" fill="#94a3b8" letter-spacing="1">OSMO ACTION 5</text>
    </g>
  <text x="240" y="328" text-anchor="middle" font-family="-apple-system,system-ui,sans-serif" font-size="13" fill="#cbd5e1" font-weight="600">DJI OSMO ACTION 5</text>
</svg>
